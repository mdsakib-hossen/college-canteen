{% extends 'admin/base_admin.html' %}
{% block title %}মেনু সম্পাদনা{% endblock %}

{% block admin_content %}
<div class="page-header">
  <a href="{{ url_for('admin.menu') }}" class="back-link">← মেনুতে ফিরুন</a>
  <h1>✏️ মেনু আইটেম সম্পাদনা</h1>
</div>

<div class="form-page-card">
  <form method="POST" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

    <div class="form-group">
      <label>আইটেমের নাম *</label>
      <input type="text" name="name" value="{{ item.name }}" required />
    </div>
    <div class="form-group">
      <label>বিবরণ</label>
      <textarea name="description" rows="2">{{ item.description }}</textarea>
    </div>
    <div class="form-group">
      <label>মূল্য (টাকা) *</label>
      <input type="number" name="price" value="{{ item.price }}" min="0" step="0.5" required />
    </div>
    <div class="form-group checkbox-group">
      <label>
        <input type="checkbox" name="is_available" {% if item.is_available %}checked{% endif %} />
        পাওয়া যাচ্ছে
      </label>
    </div>

    <div class="form-actions">
      <a href="{{ url_for('admin.menu') }}" class="btn btn-outline">বাতিল</a>
      <button type="submit" class="btn btn-primary">সংরক্ষণ করুন</button>
    </div>
  </form>
</div>
{% endblock %}
