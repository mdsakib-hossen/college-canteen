{% extends 'admin/base_admin.html' %}
{% block title %}নতুন মেনু আইটেম{% endblock %}

{% block admin_content %}
<div class="page-header">
  <a href="{{ url_for('admin.menu') }}" class="back-link">← মেনুতে ফিরুন</a>
  <h1>➕ নতুন মেনু আইটেম</h1>
</div>

<div class="form-page-card">
  <form method="POST" enctype="multipart/form-data" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

    <div class="form-group">
      <label>আইটেমের নাম *</label>
      <input type="text" name="name" placeholder="যেমন: ভাত, মুরগির তরকারি" required />
    </div>
    <div class="form-group">
      <label>বিবরণ (ঐচ্ছিক)</label>
      <textarea name="description" placeholder="সংক্ষিপ্ত বিবরণ" rows="2"></textarea>
    </div>
    <div class="form-group">
      <label>মূল্য (টাকা) *</label>
      <input type="number" name="price" min="0" step="0.5" placeholder="যেমন: 50" required />
    </div>
    <div class="form-group">
      <label>ছবি (ঐচ্ছিক)</label>
      <input type="file" name="image" accept=".jpg,.jpeg,.png,.webp" />
    </div>
    <div class="form-group checkbox-group">
      <label>
        <input type="checkbox" name="is_available" checked />
        এখনই পাওয়া যাচ্ছে
      </label>
    </div>

    <div class="form-actions">
      <a href="{{ url_for('admin.menu') }}" class="btn btn-outline">বাতিল</a>
      <button type="submit" class="btn btn-primary">আইটেম যোগ করুন</button>
    </div>
  </form>
</div>
{% endblock %}
