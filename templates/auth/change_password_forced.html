{% extends 'base.html' %}
{% block title %}নতুন পাসওয়ার্ড সেট করুন{% endblock %}

{% block body %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">🔒</div>
      <h1>নতুন পাসওয়ার্ড সেট করুন</h1>
      <p>আপনার পাসওয়ার্ড reset করা হয়েছে। নিরাপত্তার জন্য এখনই নতুন পাসওয়ার্ড দিন।</p>
    </div>

    <form method="POST" class="auth-form" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

      <div class="form-group">
        <label for="new_password">নতুন পাসওয়ার্ড *</label>
        <div class="input-eye">
          <input type="password" id="new_password" name="new_password"
                 placeholder="নতুন পাসওয়ার্ড" required autocomplete="new-password" />
          <button type="button" class="eye-btn" onclick="togglePw('new_password')">👁</button>
        </div>
        <small class="form-hint">কমপক্ষে ৮ অক্ষর, বড় হাত + ছোট হাত + সংখ্যা</small>
      </div>

      <div class="form-group">
        <label for="confirm_password">পাসওয়ার্ড নিশ্চিত করুন *</label>
        <div class="input-eye">
          <input type="password" id="confirm_password" name="confirm_password"
                 placeholder="আবার লিখুন" required autocomplete="new-password" />
          <button type="button" class="eye-btn" onclick="togglePw('confirm_password')">👁</button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block">পাসওয়ার্ড সেট করুন ✓</button>
    </form>
  </div>
</div>

<script>
function togglePw(id) {
  const inp = document.getElementById(id);
  inp.type = inp.type === 'password' ? 'text' : 'password';
}
</script>
{% endblock %}
